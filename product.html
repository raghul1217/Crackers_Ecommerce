<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail &mdash; Sivakasi666crackers</title>
  <meta name="description" content="View full details, contents &amp; live pricing for this firecracker. Order easily via WhatsApp or call. Direct from Sivakasi at wholesale prices." />
  <meta name="theme-color" content="#C1121F" />

  <!-- SEO (per-product values are updated by js/main.js at runtime) -->
  <link rel="canonical" href="https://sivakasi666crackers.com/product" id="seo-canonical" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="Sivakasi666crackers" />
  <meta property="og:url" content="https://sivakasi666crackers.com/product" id="og-url" />
  <meta property="og:title" content="Product Detail &mdash; Sivakasi666crackers" id="og-title" />
  <meta property="og:description" content="View full details, contents &amp; live pricing for this firecracker. Order via WhatsApp or call." id="og-description" />
  <meta property="og:image" content="https://sivakasi666crackers.com/images/hero-banner.jpg" id="og-image" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Product Detail &mdash; Sivakasi666crackers" id="twitter-title" />
  <meta name="twitter:description" content="View full details, contents &amp; live pricing for this firecracker." id="twitter-description" />
  <meta name="twitter:image" content="https://sivakasi666crackers.com/images/hero-banner.jpg" id="twitter-image" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body data-page="product">

  <!-- HEADER (injected from header.html) -->
  <div id="site-header"></div>

  <!-- BREADCRUMB (updated dynamically) -->
  <nav class="breadcrumb" id="product-breadcrumb" aria-label="Breadcrumb">
    <a href="/">Home</a>
    <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
    <a href="shop">Shop</a>
    <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
    <span id="breadcrumb-product-name">Product</span>
  </nav>

  <!-- MAIN -->
  <main class="product-detail-page page-container" aria-label="Product detail">
    <div id="product-detail">
      <!-- Loading state -->
      <div class="loading-state" style="padding:4rem 1rem;">
        <div class="spinner"></div>
        <p>Loading product&hellip;</p>
      </div>
    </div>

    <!-- RELATED PRODUCTS -->
    <section class="page-section" aria-labelledby="related-heading" style="margin-top:2rem;">
      <div class="section-header">
        <h2 class="section-title" id="related-heading">Related Products</h2>
        <a href="shop" class="section-see-all">See All &rarr;</a>
      </div>
      <div class="section-body">
        <div class="products-row" id="related-products-row" role="list" aria-label="Related products">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER (injected from footer.html) -->
  <div id="site-footer"></div>

  <script defer src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Update breadcrumb after product loads
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        loadProducts().then(() => {
          const p = getProductById(id);
          if (p) {
            document.title = `${p.name} \u2014 Sivakasi666crackers`;
            const nav = document.getElementById('product-breadcrumb');
            if (nav) {
              nav.innerHTML = `
                <a href="/">Home</a>
                <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
                <a href="shop?category=${encodeURIComponent(p.category)}">${p.category}</a>
                <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
                <span>${p.name}</span>
              `;
              if (window.lucide) lucide.createIcons();
            }
          }
        });
      }
    });
  </script>
</body>
</html>
