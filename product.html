<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Detail &mdash; Sparkle Crackers</title>
  <meta name="description" content="View product details, pricing, and add to cart. Place your order via WhatsApp or call." />
  <meta name="theme-color" content="#C1121F" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body data-page="product">

  <!-- HEADER (injected from header.html) -->
  <div id="site-header"></div>

  <!-- BREADCRUMB (updated dynamically) -->
  <nav class="breadcrumb" id="product-breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
    <a href="shop.html">Shop</a>
    <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
    <span id="breadcrumb-product-name">Product</span>
  </nav>

  <!-- MAIN -->
  <main class="product-detail-page page-container" aria-label="Product detail">
    <div id="product-detail">
      <!-- Loading state -->
      <div class="loading-state" style="padding:4rem 1rem;">
        <div class="spinner"></div>
        <p>Loading product&hellip;</p>
      </div>
    </div>

    <!-- RELATED PRODUCTS -->
    <section class="page-section" aria-labelledby="related-heading" style="margin-top:2rem;">
      <div class="section-header">
        <h2 class="section-title" id="related-heading">Related Products</h2>
        <a href="shop.html" class="section-see-all">See All &rarr;</a>
      </div>
      <div class="section-body">
        <div class="products-row" id="related-products-row" role="list" aria-label="Related products">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER (injected from footer.html) -->
  <div id="site-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Update breadcrumb after product loads
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (id) {
        loadProducts().then(() => {
          const p = getProductById(id);
          if (p) {
            document.title = `${p.name} \u2014 Sparkle Crackers`;
            const nav = document.getElementById('product-breadcrumb');
            if (nav) {
              nav.innerHTML = `
                <a href="index.html">Home</a>
                <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
                <a href="shop.html?category=${encodeURIComponent(p.category)}">${p.category}</a>
                <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
                <span>${p.name}</span>
              `;
              if (window.lucide) lucide.createIcons();
            }
          }
        });
      }
    });
  </script>
</body>
</html>
