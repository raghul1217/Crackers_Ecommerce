<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C1121F"/>
      <stop offset="50%" style="stop-color:#FF6F00"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="8"/>
  <!-- Fireworks sparkle icon -->
  <g fill="rgba(255,255,255,0.7)" transform="translate(200,185)">
    <!-- Center dot -->
    <circle cx="0" cy="0" r="6"/>
    <!-- Rays -->
    <rect x="-2" y="-45" width="4" height="20" rx="2"/>
    <rect x="-2" y="25" width="4" height="20" rx="2"/>
    <rect x="-45" y="-2" width="20" height="4" rx="2"/>
    <rect x="25" y="-2" width="20" height="4" rx="2"/>
    <!-- Diagonal rays -->
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(45)"/>
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(90)"/>
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(135)"/>
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(225)"/>
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(270)"/>
    <rect x="-2" y="-45" width="4" height="20" rx="2" transform="rotate(315)"/>
  </g>
  <text x="200" y="265" font-family="Arial,sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" text-anchor="middle">Sivakasi666crackers</text>
</svg>
