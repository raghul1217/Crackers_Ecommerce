<body data-page="shop">

  <!-- HEADER (injected from header.html) -->

  <!-- BREADCRUMB -->

  </nav>

  <!-- MOBILE/TABLET TOOLBAR -->
  <div class="shop-toolbar" role="search" aria-label="Product search and sort">
    <div class="search-input-wrap">
      <i data-lucide="search" class="search-icon"></i>

  <!-- FILTER DRAWER (mobile/tablet) -->

  <script defer src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const desktopSearch = document.getElementById('shop-search-input-desktop');
      const sidebarSort   = document.getElementById('sort-select-sidebar');

      if (desktopSearch) {
        desktopSearch.addEventListener('input', () => {
          _searchQuery = desktopSearch.value.trim();
          const mobileSearch = document.getElementById('shop-search-input');
          if (mobileSearch) mobileSearch.value = desktopSearch.value;
          _applyShopFilters();
        });
      }

      if (sidebarSort) {
        sidebarSort.addEventListener('change', () => {
          _activeSort = sidebarSort.value;
          const mobileSort = document.getElementById('sort-select');
          if (mobileSort) mobileSort.value = sidebarSort.value;
          _applyShopFilters();
        });
      }

      // â”€â”€ Filter drawer (mobile/tablet) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      const drawer   = document.getElementById('filter-drawer');
      const overlay  = document.getElementById('filter-drawer-overlay');
      const filterBtn = document.getElementById('shop-filter-btn');
      const closeBtn  = document.getElementById('filter-drawer-close');

      function _isCatSelected(cat) {
        if (cat === 'All') return _activeCategories.length === 0;
        return _activeCategories.indexOf(cat) !== -1;
      }
      function _renderDrawerActive() {
        document.querySelectorAll('#filter-drawer-cats .filter-cat-btn').forEach(b => {
          b.classList.toggle('active', _isCatSelected(b.dataset.category));
        });
        document.querySelectorAll('#filter-drawer-sort .filter-sort-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.sort === _activeSort);
        });
      }
      function _syncSidebarStates() {
        document.querySelectorAll('#sidebar-category-list .sidebar-cat-btn').forEach(b => {
          b.classList.toggle('active', _isCatSelected(b.dataset.category));
        });
      }
      function _syncSortControls(sort) {
        const ss = document.getElementById('sort-select-sidebar');
        if (ss) ss.value = sort;
      }
      function _clearSearch() {
        const ds = document.getElementById('shop-search-input-desktop');
        if (ds) ds.value = '';
        const ms = document.getElementById('shop-search-input');
        if (ms) ms.value = '';
        const navS = document.getElementById('navbar-search-input');
        if (navS) navS.value = '';
        _searchQuery = '';
      }
      function _openDrawer() {
        if (!drawer || !overlay) return;
        overlay.classList.add('show');
        drawer.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        _renderDrawerActive();
      }
      function _closeDrawer() {
        if (!drawer || !overlay) return;
        overlay.classList.remove('show');
        drawer.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
      if (filterBtn) filterBtn.addEventListener('click', _openDrawer);
      if (closeBtn) closeBtn.addEventListener('click', _closeDrawer);
      if (overlay) overlay.addEventListener('click', _closeDrawer);
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') _closeDrawer();
      });

      const clearBtn = document.getElementById('filter-drawer-clear');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          _activeCategories = [];
          _activeSort = 'popular';
          _clearSearch();
          _syncSidebarStates();
          _syncSortControls('popular');
          _applyShopFilters();
          _renderDrawerActive();
        });
      }

      document.querySelectorAll('#filter-drawer-sort .filter-sort-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          _activeSort = btn.dataset.sort;
          _syncSortControls(_activeSort);
          _applyShopFilters();
          _renderDrawerActive();
        });
      });

      loadProducts().then(() => {
        const cats = getCategories();
        const list = document.getElementById('sidebar-category-list');
        if (!list) return;

        cats.filter(c => c !== 'Gift Boxes').forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'sidebar-cat-btn' + (_isCatSelected(cat) ? ' active' : '');
          btn.dataset.category = cat;
          btn.setAttribute('role', 'listitem');
          btn.id = `sidebar-cat-${cat.replace(/\s+/g, '-').toLowerCase()}`;
          const iconName = CATEGORY_ICONS[cat] || 'sparkles';
          btn.innerHTML = `<span class="sidebar-check"></span><i data-lucide="${iconName}" style="width:14px;height:14px;"></i><span>${cat}</span>`;
          btn.addEventListener('click', () => {
            const c = btn.dataset.category;
            if (c === 'All') {
              _activeCategories = [];
            } else {
              const idx = _activeCategories.indexOf(c);
              if (idx !== -1) {
                _activeCategories.splice(idx, 1);
              } else {
                _activeCategories.push(c);
              }
            }
            _clearSearch();
            _syncSidebarStates();
            _renderDrawerActive();
            _applyShopFilters();
          });
          list.appendChild(btn);
        });

        // Populate filter drawer categories (multi-select with checkboxes)
        const drawerCats = document.getElementById('filter-drawer-cats');
        if (drawerCats) {
          cats.filter(c => c !== 'Gift Boxes').forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-cat-btn' + (_isCatSelected(cat) ? ' active' : '');
            btn.dataset.category = cat;
            btn.setAttribute('role', 'listitem');
            btn.setAttribute('aria-pressed', String(_isCatSelected(cat)));
            const iconName = CATEGORY_ICONS[cat] || 'sparkles';
            btn.innerHTML = `<span class="filter-check"></span><i data-lucide="${iconName}" style="width:15px;height:15px;"></i><span>${cat}</span>`;
            btn.addEventListener('click', () => {
              const c = btn.dataset.category;
              if (c === 'All') {
                _activeCategories = [];
              } else {
                const idx = _activeCategories.indexOf(c);
                if (idx !== -1) {
                  _activeCategories.splice(idx, 1);
                } else {
                  _activeCategories.push(c);
                }
              }
              _clearSearch();
              _syncSidebarStates();
              _renderDrawerActive();
              _applyShopFilters();
            });
            drawerCats.appendChild(btn);
          });
        }

        if (window.lucide) lucide.createIcons();
      });
    });
  </script>
</body>
