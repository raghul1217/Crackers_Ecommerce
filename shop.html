<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop All Crackers &mdash; Sivakasi666crackers</title>
  <meta name="description" content="Browse and buy all premium fireworks and crackers. Filter by category, sort by price, and search. Over 40 products across 13 categories." />
  <meta name="theme-color" content="#C1121F" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <style>
    .desktop-shop-search { display: none; align-items: center; gap: 8px; padding: 12px; }
    .shop-sidebar { display: none; }
    @media(min-width:1024px) {
      .desktop-shop-search { display: flex; }
      .shop-toolbar { display: none !important; }
      .chips-container.shop-chips { display: none !important; }
      .shop-layout {
        display: grid !important;
        grid-template-columns: 280px 1fr !important;
        gap: 24px !important;
        align-items: start !important;
        position: relative !important;
        padding: 8px 24px 24px !important;
      }
      .shop-sidebar {
        display: block !important;
        position: sticky !important;
        top: 70px !important;
        align-self: flex-start !important;
        max-height: calc(100vh - 85px) !important;
        overflow-y: auto !important;
        scrollbar-width: none !important;
        width: 280px !important;
        min-width: 280px !important;
        z-index: 10 !important;
      }
      .shop-sidebar::-webkit-scrollbar { display: none !important; }
      .shop-main {
        max-height: calc(100vh - 120px) !important;
        overflow-y: auto !important;
        padding-right: 12px !important;
        scrollbar-width: thin !important;
        scrollbar-color: #C1121F #f0f0f0 !important;
      }
      .shop-main::-webkit-scrollbar {
        width: 6px !important;
        display: block !important;
      }
      .shop-main::-webkit-scrollbar-track {
        background: #f0f0f0 !important;
        border-radius: 999px !important;
      }
      .shop-main::-webkit-scrollbar-thumb {
        background: #C1121F !important;
        border-radius: 999px !important;
      }
      .shop-main::-webkit-scrollbar-thumb:hover {
        background: #96040F !important;
      }
      .shop-sidebar h3 {
        color: #C1121F !important;
        font-weight: 800 !important;
        letter-spacing: 0.8px !important;
      }
      .sidebar-cat-btn.active {
        background: #C1121F !important;
        color: #ffffff !important;
        font-weight: 700 !important;
        box-shadow: 0 3px 10px rgba(193, 18, 31, 0.3) !important;
      }
      .sidebar-cat-btn.active .lucide {
        color: #ffffff !important;
      }
    }
    .sidebar-sort-wrap { margin-top: 20px; padding-top: 16px; border-top: 1px solid #F0F0F0; }
    .sidebar-sort-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #757575; margin-bottom: 8px; display: block; }
    .sidebar-sort-wrap select { width: 100%; }
  </style>
</head>
<body data-page="shop">

  <!-- HEADER (injected from header.html) -->
  <div id="site-header"></div>

  <!-- BREADCRUMB -->
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <i data-lucide="chevron-right" style="width:12px;height:12px;"></i>
    <span>Shop</span>
  </nav>

  <!-- MOBILE/TABLET TOOLBAR -->
  <div class="shop-toolbar" role="search" aria-label="Product search and sort">
    <div class="search-input-wrap">
      <i data-lucide="search" class="search-icon"></i>
      <input
        type="search"
        class="shop-search-input"
        id="shop-search-input"
        placeholder="Search crackers&hellip;"
        aria-label="Search products"
        autocomplete="off"
      />
    </div>
    <select class="sort-select" id="sort-select" aria-label="Sort products">
      <option value="popular">Popular</option>
      <option value="price-asc">Price &uarr;</option>
      <option value="price-desc">Price &darr;</option>
    </select>
  </div>

  <!-- CATEGORY CHIPS (mobile/tablet) -->
  <div class="chips-container shop-chips" id="shop-category-chips" role="list" aria-label="Filter by category">
    <!-- Rendered by JS -->
  </div>

  <!-- MAIN LAYOUT -->
  <main class="shop-layout" aria-label="Product listings">

    <!-- DESKTOP SIDEBAR -->
    <aside class="shop-sidebar" aria-label="Filter sidebar">
      <h3>Categories</h3>
      <div class="sidebar-category-list" id="sidebar-category-list" role="list" aria-label="Category filter">
        <!-- Rendered by JS -->
      </div>

      <div class="sidebar-sort-wrap">
        <span class="sidebar-sort-label">Sort by</span>
        <select class="sort-select" id="sort-select-sidebar" aria-label="Sort products">
          <option value="popular">Most Popular</option>
          <option value="price-asc">Price: Low &rarr; High</option>
          <option value="price-desc">Price: High &rarr; Low</option>
        </select>
      </div>
    </aside>

    <!-- PRODUCTS AREA -->
    <div class="shop-main">
      <p class="results-count" id="results-count" aria-live="polite" aria-atomic="true">Loading&hellip;</p>
      <div class="products-grid" id="products-grid" role="list" aria-label="Products">
        <div class="loading-state" style="grid-column:1/-1;">
          <div class="spinner"></div>
          <p>Loading products&hellip;</p>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER (injected from footer.html) -->
  <div id="site-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/render.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const desktopSearch = document.getElementById('shop-search-input-desktop');
      const sidebarSort   = document.getElementById('sort-select-sidebar');

      if (desktopSearch) {
        desktopSearch.addEventListener('input', () => {
          _searchQuery = desktopSearch.value.trim();
          const mobileSearch = document.getElementById('shop-search-input');
          if (mobileSearch) mobileSearch.value = desktopSearch.value;
          _applyShopFilters();
        });
      }

      if (sidebarSort) {
        sidebarSort.addEventListener('change', () => {
          _activeSort = sidebarSort.value;
          const mobileSort = document.getElementById('sort-select');
          if (mobileSort) mobileSort.value = sidebarSort.value;
          _applyShopFilters();
        });
      }

      loadProducts().then(() => {
        const cats = getCategories();
        const list = document.getElementById('sidebar-category-list');
        if (!list) return;

        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.className = 'sidebar-cat-btn' + (cat === _activeCategory ? ' active' : '');
          btn.dataset.category = cat;
          btn.setAttribute('role', 'listitem');
          btn.id = `sidebar-cat-${cat.replace(/\s+/g, '-').toLowerCase()}`;
          const iconName = CATEGORY_ICONS[cat] || 'sparkles';
          btn.innerHTML = `<i data-lucide="${iconName}" style="width:14px;height:14px;"></i><span>${cat}</span>`;
          btn.addEventListener('click', () => {
            list.querySelectorAll('.sidebar-cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            _activeCategory = cat;
            _searchQuery = '';
            const ds = document.getElementById('shop-search-input-desktop');
            if (ds) ds.value = '';
            const ms = document.getElementById('shop-search-input');
            if (ms) ms.value = '';
            _applyShopFilters();
          });
          list.appendChild(btn);
        });

        if (window.lucide) lucide.createIcons();
      });
    });
  </script>
</body>
</html>
